[pytest]
# Default run options:
#   --headed        -> add on the CLI when you want to watch the browser
#   --browser       -> chromium (default) | firefox | webkit
# --strict-markers turns a typo'd marker into an error instead of a silent
# no-op. Without it `-m smok` or @pytest.mark.smok selects nothing and the run
# passes green -- the classic false-confidence bug.
# --strict-config does the same for this file.
# The HTML report is deliberately NOT here: writing a full report when someone
# runs a single test to debug it is friction. Use `make report` / the CI flag.
addopts = -v --tb=short --strict-markers --strict-config

# Custom markers (run a subset with e.g.  pytest -m smoke)
markers =
    smoke: quick critical-path checks
    api: REST API tests
    network: network interception / mocking tests

# Folder Playwright writes traces/screenshots/videos into on failure
# (enable with --tracing retain-on-failure --screenshot only-on-failure)
