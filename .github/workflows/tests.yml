name: Playwright Tests

# Run on every push / PR to the main branch, plus a manual trigger.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Least privilege: without this the job inherits the repository default token.
permissions:
  contents: read

# Three pushes in a minute should not run three full browser installs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20      # a hung browser otherwise burns the 360m default
    steps:
      # NOTE: actions are pinned by tag, not by commit SHA. A tag can be
      # repointed at any commit by whoever controls the action, which is how
      # the tj-actions/changed-files compromise reached thousands of repos.
      # Pin these properly with a tool that resolves real SHAs:
      #     go install github.com/suzuki-shunsuke/pinact/cmd/pinact@latest
      #     pinact run
      # Dependabot (see .github/dependabot.yml) then keeps the SHAs current.
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Name the engine. Bare `playwright install` pulls Chromium, Firefox AND
      # WebKit -- roughly 400MB -- on every run, while the suite only ever uses
      # Chromium.
      #
      # The cache key includes the resolved Playwright version, so upgrading the
      # client always fetches matching binaries: a stale-browser/new-client
      # mismatch is a horrible bug to diagnose.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version(\"playwright\"))')" >> "$GITHUB_OUTPUT"

      - name: Cache browser binaries
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      # Even on a cache HIT the OS-level shared libraries must be installed:
      # they live in /usr/lib, outside the cached directory. Forgetting this is
      # the most common broken-cache bug in Playwright CI.
      - name: Install OS dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run tests
        run: |
          pytest --tracing retain-on-failure --screenshot only-on-failure \
                 --html=reports/report.html --self-contained-html

      - name: Upload HTML report
        if: always()            # upload even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
